.pr{fill:#ffd98a}.ok{fill:#7fe39a}.in{fill:#ffd98a}.bold{font-weight:bold}
.typ{transform-box:fill-box;transform-origin:0 50%;animation:typ 20.0s linear infinite}
.cm{animation:cm 20.0s linear infinite}
.cur{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
@keyframes a1{0%,1.0%{opacity:0}2.5%,92.5%{opacity:1}99.0%,100%{opacity:0}}
