<text x="20" y="76" class="ln" style="animation-name:a1"><tspan class="pr">PS D:\&gt;</tspan></text>
<g clip-path="url(#tc)"><text x="92.0" y="76" class="ln cmd" style="animation-name:a1">.\Join-Domain.ps1</text></g>
<text x="20" y="101" class="ln" style="animation-name:a2"><tspan class="ok">[OK]</tspan> DNS configure vers 192.0.2.10</text>
<text x="20" y="126" class="ln" style="animation-name:a3">Etage (E1, E2, RDC...): <tspan class="in">E1</tspan></text>
