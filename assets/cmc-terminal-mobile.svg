@keyframes a11{0%,44.0%{opacity:0}45.5%,92.5%{opacity:1}99.0%,100%{opacity:0}}
@keyframes a12{0%,43.99%{opacity:0}44.0%,49.99%{opacity:1}50.0%,100%{opacity:0}}
@keyframes a13{0%,49.99%{opacity:0}50.0%,55.99%{opacity:1}56.0%,100%{opacity:0}}
@keyframes a14{0%,55.99%{opacity:0}56.0%,61.99%{opacity:1}62.0%,100%{opacity:0}}
@keyframes a15{0%,61.99%{opacity:0}62.0%,67.99%{opacity:1}68.0%,100%{opacity:0}}
@keyframes a16{0%,67.99%{opacity:0}68.0%,92.5%{opacity:1}99.0%,100%{opacity:0}}
