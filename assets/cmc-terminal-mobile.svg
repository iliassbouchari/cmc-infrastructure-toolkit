<text x="20" y="201" class="ln" style="animation-name:a6">ID PC (00=Prof, 01-20=Stagiaire): <tspan class="in">00</tspan></text>
<text x="20" y="226" class="ln" style="animation-name:a7"><tspan class="ok">[OK]</tspan> Machine E1DIAS0400 jointe au</text>
<text x="20" y="251" class="ln" style="animation-name:a8">domaine domain.local dans</text>
<text x="20" y="276" class="ln" style="animation-name:a9">OU=S04,OU=DIA,OU=CMC_Computers,</text>
<text x="20" y="301" class="ln" style="animation-name:a10">DC=domain,DC=local</text>
<text x="20" y="326" class="ln" style="animation-name:a11">Time per PC :</text>
<text x="146.0" y="326" class="ln cv in" style="animation-name:a12;animation-timing-function:step-end">~20 min</text>
<text x="146.0" y="326" class="ln cv in" style="animation-name:a13;animation-timing-function:step-end">14 min</text>
<text x="146.0" y="326" class="ln cv in" style="animation-name:a14;animation-timing-function:step-end">8 min</text>
<text x="146.0" y="326" class="ln cv in" style="animation-name:a15;animation-timing-function:step-end">4 min</text>
