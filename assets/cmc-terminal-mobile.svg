<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 456" width="480" height="456" role="img" aria-label="Animated PowerShell terminal running Join-Domain.ps1: DNS set, naming fields typed, machine renamed and joined to the domain, time per PC falling from about 20 minutes to under 3 minutes.">
<title>Join-Domain.ps1 demo</title>
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d0000"/><stop offset="1" stop-color="#b30d0d"/></linearGradient>
<clipPath id="tc"><rect class="typ" x="92.0" y="58" width="150.0" height="24"/></clipPath>
</defs>
<style>
