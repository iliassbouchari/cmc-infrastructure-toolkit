<text x="20" y="351" class="ln" style="animation-name:a17"><tspan class="ok">[ OK ]</tspan> ~20 min by hand -&gt;</text>
<text x="20" y="376" class="ln" style="animation-name:a18">under 3 min per PC with</text>
<text x="20" y="401" class="ln" style="animation-name:a19">Join-Domain.ps1</text>
<g class="ln" style="animation-name:a20"><text x="20" y="426" class="ln"><tspan class="pr">PS D:\&gt;</tspan></text><rect class="cur" x="92.0" y="414" width="8" height="15" fill="#7fe39a"/></g>
<g class="cm"><rect class="cur" x="236.0" y="64" width="8" height="15" fill="#7fe39a"/></g>
