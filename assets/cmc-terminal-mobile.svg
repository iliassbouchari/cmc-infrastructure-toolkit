@keyframes a20{0%,77.0%{opacity:0}78.5%,92.5%{opacity:1}99.0%,100%{opacity:0}}
@keyframes typ{0%,3.0%{transform:scaleX(0);animation-timing-function:steps(16,end)}11.0%,100%{transform:scaleX(1)}}
@keyframes cm{0%,3.0%{transform:translateX(-144.0px);animation-timing-function:steps(16,end);opacity:0}3.1%{opacity:1}11.0%{transform:translateX(0);opacity:1}12.5%,100%{transform:translateX(0);opacity:0}}
