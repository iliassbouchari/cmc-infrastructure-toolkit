<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Network topology: Internet to FortiGate to Cisco core to Active Directory, which feeds Wazuh, Proxmox and Zabbix. The Cisco core also feeds switches and the 10 training poles. Animated dots show traffic flowing in one direction.">
