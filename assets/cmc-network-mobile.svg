<rect x="20" y="560" width="200" height="38" rx="8" fill="rgba(251,239,213,.06)" stroke="#fbefd5" stroke-width="1.6"/><text x="120.0" y="584.0" class="lb" text-anchor="middle">THR</text>
<rect x="260" y="560" width="200" height="38" rx="8" fill="rgba(251,239,213,.06)" stroke="#fbefd5" stroke-width="1.6"/><text x="360.0" y="584.0" class="lb" text-anchor="middle">INDUS</text>
<text x="240" y="636" class="sb" text-anchor="middle">10 training poles, 850+ workstations joined to the domain</text>
<rect x="20" y="660" width="440" height="124" rx="8" fill="rgba(0,0,0,.28)" stroke="#fbefd5" stroke-opacity=".35"/>
<text x="38" y="684" class="lb">Legend</text>
