<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800" role="img" aria-label="Network topology: Internet to FortiGate to Cisco core to Active Directory, which feeds Wazuh, Proxmox and Zabbix. The Cisco core feeds the switches, which serve the 10 training poles.">
<title>Network topology</title>
