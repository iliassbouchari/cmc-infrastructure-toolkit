<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<radialGradient id="bg" cx="50%" cy="55%" r="80%"><stop offset="0" stop-color="#c70b0b"/><stop offset=".6" stop-color="#a90606"/><stop offset="1" stop-color="#7d0000"/></radialGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f1dcb3"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="soft" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fbefd5" stroke-opacity=".06"/></pattern>
</defs>
<style>
text{font-family:Consolas,'Cascadia Mono','Lucida Console','DejaVu Sans Mono',monospace}
.pop{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,1.4,.4,1)}
.bob{animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{0%{transform:translateY(-3px)}100%{transform:translateY(3px)}}
.pulse{animation:pl 2.4s ease-in-out infinite alternate}
@keyframes pl{0%{opacity:.25}100%{opacity:.7}}
.sh{opacity:0;animation:shn 12s linear infinite}
@keyframes shn{0%,2%{opacity:0}4%{opacity:.55}9%,100%{opacity:0}}
.title{animation:tt 12s ease-out infinite}
@keyframes tt{0%,2%{opacity:0}8%,93%{opacity:1}100%{opacity:0}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@keyframes p0{0%,4%{opacity:0;transform:translateY(40px) scale(.4)}11%,93%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes p1{0%,8%{opacity:0;transform:translateY(40px) scale(.4)}15%,93%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes p2{0%,12%{opacity:0;transform:translateY(40px) scale(.4)}19%,93%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes p3{0%,16%{opacity:0;transform:translateY(40px) scale(.4)}23%,93%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes p4{0%,20%{opacity:0;transform:translateY(40px) scale(.4)}27%,93%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes p5{0%,24%{opacity:0;transform:translateY(40px) scale(.4)}31%,93%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes p6{0%,28%{opacity:0;transform:translateY(40px) scale(.4)}35%,93%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
